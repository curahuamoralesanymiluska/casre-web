<nav class="casre__navbar" [class.casre__navbar--scrolled]="isScrolled()">
  <div class="casre__navbar-container">

    <a routerLink="/" class="casre__navbar-brand">
      <img
        src="assets/images/logo-casre-hd.png"
        alt="CASRE INGENIERÍA"
        class="casre__navbar-logo"
      />
    </a>

    <ul class="casre__navbar-links">
      <li><a routerLink="/"         routerLinkActive="casre__navbar-link--active" [routerLinkActiveOptions]="{exact:true}">Inicio</a></li>
      <li><a routerLink="/nosotros" routerLinkActive="casre__navbar-link--active">Nosotros</a></li>
      <li><a routerLink="/servicios" routerLinkActive="casre__navbar-link--active">Servicios</a></li>
      <li><a routerLink="/contacto" routerLinkActive="casre__navbar-link--active">Contacto</a></li>
    </ul>

    <a href="#cotizar" class="casre__navbar-cta">Solicitar Cotización</a>

    <button
      class="casre__navbar-hamburger"
      [class.casre__navbar-hamburger--open]="menuOpen()"
      (click)="toggleMenu()"
      aria-label="Abrir Menú"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile Drawer Overlay -->
  <div class="casre__navbar-overlay" [class.casre__navbar-overlay--open]="menuOpen()" (click)="closeMenu()"></div>

  <!-- Mobile Drawer -->
  <div class="casre__navbar-drawer" [class.casre__navbar-drawer--open]="menuOpen()">
    <div class="casre__navbar-drawer-header">
      <img src="assets/images/logo-casre-hd.png" alt="CASRE INGENIERÍA" class="casre__navbar-drawer-logo" />
      <button class="casre__navbar-drawer-close" (click)="closeMenu()" aria-label="Cerrar Menú">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <ul class="casre__navbar-drawer-links">
      <li><a routerLink="/"          (click)="closeMenu()">Inicio</a></li>
      <li><a routerLink="/nosotros"  (click)="closeMenu()">Nosotros</a></li>
      <li><a routerLink="/servicios" (click)="closeMenu()">Servicios</a></li>
      <li><a routerLink="/contacto"  (click)="closeMenu()">Contacto</a></li>
    </ul>

    <div class="casre__navbar-drawer-footer">
      <a href="#cotizar" (click)="closeMenu()" class="casre__navbar-drawer-cta">Solicitar Cotización</a>
    </div>
  </div>
</nav>
