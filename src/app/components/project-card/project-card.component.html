<div class="project-card" [class]="'status-' + project().status.toLowerCase()">
  <div class="card-header">
    <span class="category-badge" [class]="project().category.toLowerCase()">
      {{ project().category }}
    </span>
    <button class="star-btn" (click)="onStarClick()" aria-label="Star Project">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="star-icon">
        <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd" />
      </svg>
      <span class="star-count">{{ project().stars }}</span>
    </button>
  </div>

  <div class="card-body">
    <h3 class="project-title">{{ project().name }}</h3>
    <p class="project-description">{{ project().description | truncate:120 }}</p>
    
    <div class="tag-container">
      @for (tag of project().tags; track tag) {
        <span class="tag-badge">#{{ tag }}</span>
      }
    </div>
  </div>

  <div class="card-footer">
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span class="status-text">{{ project().status }}</span>
    </div>
    <div class="updated-time">
      Updated {{ project().updatedAt | date:'MMM d, y' }}
    </div>
  </div>
</div>
